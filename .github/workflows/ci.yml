name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react-version: [18, 19]
    name: CI (React ${{ matrix.react-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Override to React ${{ matrix.react-version }}
        if: matrix.react-version == 19
        run: pnpm add -D react@^19 react-dom@^19 @types/react@^19 @types/react-dom@^19

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm size
